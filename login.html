<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>შესვლა | ia's თაიგული</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-links">
            <a href="index.html">მთავარი</a>
            <a href="kalata.html">კალათა <span id="cart-count" class="cart-badge">0</span></a>
        </div>
        <div class="nav-auth" id="nav-auth"></div>
    </nav>

    <header>
        <h2>შესვლა</h2>
        <p>გილოცავთ დაბრუნებას!</p>
    </header>

    <div class="auth-wrap">
        <p class="auth-note" id="redirect-note" hidden>შეკვეთის დასასრულებლად გთხოვთ, შედით სისტემაში — კალათა შენარჩუნებული დარჩება.</p>
        <form id="login-form" class="auth-form" novalidate>
            <label>
                ელფოსტა
                <input type="email" id="login-email" autocomplete="email" required>
            </label>
            <label>
                პაროლი
                <input type="password" id="login-password" autocomplete="current-password" required>
            </label>
            <p class="auth-error" id="login-error"></p>
            <button type="submit">შესვლა</button>
        </form>
        <p class="auth-switch">არ გაქვთ ანგარიში? <a href="register.html">დარეგისტრირდით</a></p>
    </div>

    <footer>&copy; 2026 ia's თაიგული</footer>

    <script src="auth.js"></script>
    <script src="main.js"></script>
    <script src="login.js"></script>
</body>
</html>
